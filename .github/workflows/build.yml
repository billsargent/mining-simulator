# Builds the game for Windows, Linux and macOS. Runs by hand (Actions > Build > Run workflow)
# and on version tags (v*), which also attach the builds to a GitHub release.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $dest
          unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz \
            templates/windows_release_x86_64.exe templates/linux_release.x86_64 \
            templates/macos.zip templates/version.txt -d $dest
          rm *.zip *.tpz

      - name: Stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i "s/^config\/version=.*/config\/version=\"$v\"/" project.godot
          grep '^config/version=' project.godot

      - name: Self-test
        run: timeout 900 godot --headless --path . -- --selftest

      - name: Export
        run: |
          mkdir -p build/windows build/linux build/macos
          godot --headless --path . --import
          godot --headless --path . --export-release "Windows" build/windows/Paystreak.exe
          godot --headless --path . --export-release "Linux" build/linux/Paystreak.x86_64
          godot --headless --path . --export-release "macOS" build/macos/Paystreak.zip
          cd build
          (cd windows && zip -q ../Paystreak-windows.zip Paystreak.exe)
          (cd linux && chmod +x Paystreak.x86_64 && tar czf ../Paystreak-linux.tar.gz Paystreak.x86_64)
          cp macos/Paystreak.zip Paystreak-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Paystreak-builds
          path: |
            build/Paystreak-windows.zip
            build/Paystreak-linux.tar.gz
            build/Paystreak-macos.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="build/Paystreak-windows.zip build/Paystreak-linux.tar.gz build/Paystreak-macos.zip"
          # A release made on GitHub's Releases page already exists (it made the tag): add the
          # builds to it. Otherwise make the release.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes $files
          fi
